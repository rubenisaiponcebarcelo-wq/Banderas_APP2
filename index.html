<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Banderas del Mundo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#080810">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Banderas">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#080810;--card:#111120;--border:rgba(255,255,255,.07);
  --text:#ede8df;--muted:#9e9890;--dim:#3a3530;
  --gold:#c9a84c;--gold-dim:rgba(201,168,76,.15);
  --green:#7dd4a0;--green-dim:rgba(74,160,100,.15);
  --red:#e08080;--red-dim:rgba(210,80,80,.12);
}
html{height:100%;color-scheme:dark;}body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
body{display:flex;flex-direction:column;align-items:center;padding:1.2rem 1rem 3rem;min-height:100vh;position:relative;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(180,140,60,.08) 0%,transparent 70%),radial-gradient(ellipse 40% 30% at 80% 80%,rgba(60,80,180,.05) 0%,transparent 60%);pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;width:100%;max-width:520px;}

/* Header */
.title{font-family:'Cormorant Garamond',serif;font-size:1.85rem;font-weight:600;letter-spacing:.03em;line-height:1;text-align:center;margin-bottom:1rem;}
.title em{color:var(--gold);font-style:italic;}

/* Mode toggle */
.mode-toggle{display:flex;gap:.4rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:999px;padding:.25rem;margin-bottom:.9rem;}
.mode-btn{flex:1;padding:.35rem .45rem;border:none;border-radius:999px;font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:500;cursor:pointer;transition:all .2s;background:transparent;color:#3a3530;letter-spacing:.04em;}
.mode-btn.active{background:rgba(201,168,76,.18);border:1px solid rgba(201,168,76,.4);color:var(--gold);}
.mode-btn:not(.active):hover{color:#6a6460;}

/* Continent selector */
.cont-wrap{display:flex;gap:.4rem;flex-wrap:wrap;padding:.3rem 0 .8rem;margin-bottom:.6rem;}

.cont-btn{flex-shrink:0;padding:.32rem .65rem;border-radius:999px;font-family:'DM Sans',sans-serif;font-size:.68rem;font-weight:500;letter-spacing:.04em;cursor:pointer;border:1px solid;transition:all .18s;white-space:nowrap;background:transparent;}
.cont-btn.active{background:rgba(201,168,76,.18);border-color:rgba(201,168,76,.5);color:var(--gold);}
.cont-btn:not(.active){border-color:rgba(255,255,255,.08);color:#3a3530;}
.cont-btn:not(.active):hover{border-color:rgba(255,255,255,.14);color:#6a6460;}

/* Mastery bar */
.mastery-wrap{margin-bottom:.9rem;}
.mastery-header{display:flex;justify-content:space-between;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:.3rem;}
.mastery-track{height:4px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden;position:relative;}
.mastery-fill-wrong{position:absolute;left:0;top:0;height:100%;background:rgba(210,80,80,.35);border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.mastery-fill-ok{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#4aa064,var(--green));border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1);}

/* Scores */
.scores{display:flex;gap:.45rem;margin-bottom:.9rem;justify-content:center;flex-wrap:wrap;}
.pill{display:flex;align-items:center;gap:.35rem;padding:.35rem .75rem;border-radius:999px;font-size:.74rem;font-weight:500;border:1px solid;}
.pill-n{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;}
.c-ok{background:var(--green-dim);border-color:rgba(74,160,100,.28);color:var(--green);}
.c-no{background:var(--red-dim);border-color:rgba(210,80,80,.25);color:var(--red);}
.c-str{background:var(--gold-dim);border-color:rgba(201,168,76,.28);color:var(--gold);}
.c-rec{background:rgba(140,100,200,.12);border-color:rgba(140,100,200,.28);color:#b899f5;}

/* Progress */
.prog-wrap{margin-bottom:.9rem;}
.prog-labels{display:flex;justify-content:space-between;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:.3rem;}
.prog-track{height:2px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,#7a5f20,var(--gold));border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1);}

/* Card */
.scene{perspective:1100px;cursor:pointer;margin-bottom:.8rem;}
.card{position:relative;width:100%;height:340px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1);}
.card.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border:1px solid var(--border);background:var(--card);}

/* Front */
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;}



.flag-emoji{font-size:7rem;line-height:1;user-select:none;transition:transform .2s;display:flex;align-items:center;justify-content:center;}
.scene:hover 


.flag-emoji{transform:scale(1.04);}
.tap-hint{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:#252220;display:flex;align-items:center;gap:.4rem;}
.tap-hint::before,.tap-hint::after{content:'';display:block;height:1px;width:18px;background:#252220;}

/* Back */
.back{transform:rotateY(180deg);display:flex;flex-direction:column;padding:.9rem 1.1rem;gap:.35rem;}
.back-top{display:flex;align-items:center;gap:.9rem;flex-shrink:0;}
.flag-emoji-sm{font-size:2.1rem;line-height:1;flex-shrink:0;user-select:none;}
.country-name{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:600;color:var(--text);line-height:1.1;}
.meta-row{display:flex;align-items:center;gap:.4rem;margin-top:.2rem;flex-wrap:wrap;}
.meta-item{font-size:.72rem;color:#5a5450;}
.meta-sep{font-size:.72rem;color:#2a2622;}
.divider{height:1px;background:linear-gradient(90deg,rgba(201,168,76,.35),transparent);flex-shrink:0;}
.fact-text{font-size:.82rem;line-height:1.65;color:var(--muted);font-weight:300;flex:1;overflow:hidden;}

/* Multiple choice options */
.mc-options{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.7rem;}
.mc-btn{padding:.7rem .5rem;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.04);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:400;cursor:pointer;transition:all .18s;text-align:center;line-height:1.2;}
.mc-btn:hover:not(:disabled){border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--text);}
.mc-btn:disabled{cursor:default;}
.mc-btn.correct{background:rgba(74,160,100,.2);border-color:rgba(74,160,100,.5);color:var(--green);}
.mc-btn.wrong{background:rgba(210,80,80,.15);border-color:rgba(210,80,80,.4);color:var(--red);}
.mc-btn.reveal{background:rgba(74,160,100,.1);border-color:rgba(74,160,100,.3);color:#5a9a72;}

/* Flashcard nav row */
.nav-row{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:.5rem;align-items:center;margin-bottom:.7rem;}
.btn{padding:.8rem .5rem;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:.3rem;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.2;pointer-events:none;}
.btn-ok{background:var(--green-dim);border:1px solid rgba(74,160,100,.35);color:var(--green);}
.btn-ok:hover:not(:disabled){background:rgba(74,160,100,.25);border-color:rgba(74,160,100,.55);}
.btn-no{background:var(--red-dim);border:1px solid rgba(210,80,80,.3);color:var(--red);}
.btn-no:hover:not(:disabled){background:rgba(210,80,80,.22);border-color:rgba(210,80,80,.5);}
.btn-nav{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#5a5450;padding:.8rem .65rem;}
.btn-nav:hover:not(:disabled){background:rgba(255,255,255,.09);color:var(--muted);}

/* Next button (MC mode) */
.btn-next{width:100%;padding:.82rem;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:.84rem;font-weight:500;cursor:pointer;transition:all .18s;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--muted);display:none;margin-bottom:.7rem;}
.btn-next:hover{background:rgba(255,255,255,.1);color:var(--text);}
.btn-next.show{display:block;}

.reviewing-badge{display:none;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:#4a4440;text-align:center;margin-top:-.3rem;margin-bottom:.4rem;}
.reviewing-badge.show{display:block;}

/* Stats modal */
.stats-overlay{position:fixed;inset:0;background:rgba(8,8,16,.88);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
.stats-overlay.show{opacity:1;pointer-events:all;}
.stats-panel{background:#13131f;border:1px solid rgba(255,255,255,.08);border-radius:20px 20px 0 0;width:100%;max-width:460px;padding:1.5rem 1.4rem 2.5rem;transform:translateY(40px);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.stats-overlay.show .stats-panel{transform:translateY(0);}
.stats-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;color:var(--text);margin-bottom:1.2rem;display:flex;justify-content:space-between;align-items:center;}
.stats-close{background:none;border:none;color:#3a3530;font-size:1.2rem;cursor:pointer;padding:.2rem;}
.stats-close:hover{color:var(--muted);}
.stats-cont{margin-bottom:.9rem;}
.stats-cont-name{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:.35rem;display:flex;justify-content:space-between;}
.stats-bar-track{height:6px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden;position:relative;}
.stats-bar-w{position:absolute;left:0;top:0;height:100%;background:rgba(210,80,80,.3);border-radius:6px;}
.stats-bar-ok{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#4aa064,var(--green));border-radius:6px;}
.stats-records{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem;margin-top:1.2rem;}
.stat-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:.75rem .6rem;text-align:center;}
.stat-card-n{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:600;color:var(--text);}
.stat-card-l{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:#3a3530;margin-top:.1rem;}
.stats-btn{position:fixed;top:1rem;left:1rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:.35rem .6rem;color:#3a3530;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:'DM Sans',sans-serif;z-index:40;transition:color .2s;}
.stats-btn:hover{color:#6a6460;}

/* Streak badge */
#streak-badge{position:fixed;top:1rem;right:1rem;background:var(--gold-dim);border:1px solid rgba(201,168,76,.3);border-radius:999px;padding:.3rem .6rem;font-size:.72rem;color:var(--gold);font-weight:500;z-index:20;transition:opacity .4s,transform .4s;opacity:0;transform:translateY(-6px);pointer-events:none;}
#streak-badge.show{opacity:1;transform:translateY(0);}

footer{text-align:center;font-size:.63rem;color:#222018;letter-spacing:.08em;margin-top:.8rem;}

@media (min-width: 600px) {
  body { padding: 2rem 1.5rem 3rem; }
  #app { max-width: 560px; }
  .title { font-size: 2.2rem; }
  .card { height: 380px; }
  #flag-front { width: 180px !important; height: 120px !important; }
  .scores { gap: .6rem; }
  .pill { padding: .4rem .9rem; font-size: .8rem; }
  .pill-n { font-size: 1.1rem; }
  .cont-btn { padding: .38rem .75rem; font-size: .72rem; }
  .mc-btn { font-size: .85rem; padding: .78rem .6rem; }
  .btn { font-size: .85rem; }
  .fact-text { font-size: .88rem; }
}

.extra-grid{display:grid;grid-template-columns:1fr 1fr;gap:.28rem .5rem;flex-shrink:0;}
.extra-item{display:flex;align-items:baseline;gap:.3rem;font-size:.72rem;color:#6a6460;line-height:1.3;}
.extra-item.extra-full{grid-column:1/-1;}
.extra-icon{font-size:.7rem;flex-shrink:0;}
</style>
</head>
<body>

<div id="streak-badge">🔥 <span id="streak-num">0</span> en racha</div>
<button class="stats-btn" onclick="openStats()">📊 Stats</button>

<!-- Stats modal -->
<div class="stats-overlay" id="stats-overlay" onclick="closeStats(event)">
  <div class="stats-panel">
    <div class="stats-title">
      Mis estadísticas
      <button class="stats-close" onclick="closeStats()">✕</button>
    </div>
    <div id="stats-conts"></div>
    <div class="stats-records" id="stats-records"></div>
  </div>
</div>

<div id="app">
  <h1 class="title">Banderas del <em>Mundo</em></h1>

  <!-- Mode toggle -->
  <div class="mode-toggle">
    <button class="mode-btn active" id="mode-flash" onclick="setMode('flash')">🃏 Flashcard</button>
    <button class="mode-btn" id="mode-test"   onclick="setMode('test')">🎯 Test</button>
    <button class="mode-btn" id="mode-timer"  onclick="setMode('timer')">⏱️ Tiempo</button>
    <button class="mode-btn" id="mode-marathon" onclick="setMode('marathon')">🔄 Maratón</button>
  </div>
  <!-- Timer display -->
  <div id="timer-wrap" style="display:none;text-align:center;margin-bottom:.7rem;">
    <div id="timer-display" style="font-family:'Cormorant Garamond',serif;font-size:2.5rem;font-weight:600;color:var(--gold);line-height:1;">60</div>
    <div style="font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:#3a3530;">segundos</div>
  </div>
  <!-- Marathon progress -->
  <div id="marathon-wrap" style="display:none;text-align:center;margin-bottom:.6rem;font-size:.72rem;color:#5a5450;letter-spacing:.06em;">
    Sin dominar: <span id="marathon-left" style="color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;">0</span>
  </div>
  <!-- End screen -->
  <div id="end-screen" style="display:none;background:#13131f;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:1.8rem 1.5rem;text-align:center;margin-bottom:1rem;">
    <div style="font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:600;color:var(--text);margin-bottom:.5rem;" id="end-title">¡Tiempo!</div>
    <div style="font-size:.8rem;color:var(--muted);margin-bottom:1.2rem;" id="end-msg"></div>
    <button onclick="restartMode()" style="padding:.75rem 2rem;border:none;border-radius:12px;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.35);color:var(--gold);font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer;">Jugar de nuevo</button>
  </div>

  <!-- Continent selector -->
  <div class="cont-wrap" id="cont-wrap">
    <button class="cont-btn active" data-co="all" onclick="setCont(this)">🌐 Todos (196)</button>
    <button class="cont-btn" data-co="A"   onclick="setCont(this)">🌍 África (53)</button>
    <button class="cont-btn" data-co="N"   onclick="setCont(this)">🌎 N. América (23)</button>
    <button class="cont-btn" data-co="S"   onclick="setCont(this)">🌎 S. América (12)</button>
    <button class="cont-btn" data-co="As"  onclick="setCont(this)">🌏 Asia (48)</button>
    <button class="cont-btn" data-co="E"   onclick="setCont(this)">🏛️ Europa (46)</button>
    <button class="cont-btn" data-co="O"   onclick="setCont(this)">🏝️ Oceanía (14)</button>
  </div>

  <!-- Mastery bar -->
  <div class="mastery-wrap">
    <div class="mastery-header">
      <span id="mastery-label">Dominadas</span>
      <span id="mastery-count">0 / 196</span>
    </div>
    <div class="mastery-track">
      <div class="mastery-fill-wrong" id="mastery-wrong" style="width:0%"></div>
      <div class="mastery-fill-ok"    id="mastery-ok"    style="width:0%"></div>
    </div>
  </div>

  <!-- Scores -->
  <div class="scores">
    <div class="pill c-ok"><span class="pill-n" id="sc-correct">0</span><span>Aciertos</span></div>
    <div class="pill c-no"><span class="pill-n" id="sc-wrong">0</span><span>Fallos</span></div>
    <div class="pill c-str"><span class="pill-n" id="sc-streak">0</span><span>Racha</span></div>
    <div class="pill c-rec"><span class="pill-n" id="sc-record">0</span><span>Récord</span></div>
  </div>

  <!-- Progress -->
  <div class="prog-wrap">
    <div class="prog-labels">
      <span id="prog-label">Todos los países</span>
      <span><span id="prog-cur">0</span> / <span id="prog-tot">196</span></span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>

  <!-- Card -->
  <div class="scene" id="scene" onclick="handleCardClick()">
    <div class="card" id="card">
      <div class="face front">
        <img id="flag-front" src="" alt="" data-size="lg" style="width:160px;height:107px;object-fit:cover;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);display:block;">
        <p class="tap-hint" id="tap-hint">toca para revelar</p>
      </div>
      <div class="face back">
        <div class="back-top">
          <img id="flag-back" src="" alt="" data-size="sm" style="width:44px;height:29px;object-fit:cover;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.07);flex-shrink:0;">
          <div>
            <h2 class="country-name" id="country-name">—</h2>
            <div class="meta-row">
              <span class="meta-item">🏛 <span id="meta-cap">—</span></span>
              <span class="meta-sep">·</span>
              <span class="meta-item">👥 <span id="meta-pop">—</span></span>
            </div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="extra-grid" id="extra-grid">
          <div class="extra-item"><span class="extra-icon">🗣️</span><span id="meta-lang">—</span></div>
          <div class="extra-item"><span class="extra-icon">💰</span><span id="meta-cur">—</span></div>
          <div class="extra-item"><span class="extra-icon">🌐</span><span id="meta-dom">—</span></div>
          <div class="extra-item"><span class="extra-icon">📐</span><span id="meta-area">—</span></div>
          <div class="extra-item extra-full"><span class="extra-icon">🏔️</span><span id="meta-peak">—</span></div>
        </div>
        <div class="divider"></div>
        <p class="fact-text" id="fact-text"></p>
      </div>
    </div>
  </div>

  <!-- Multiple choice options (test mode) -->
  <div class="mc-options" id="mc-options" style="display:none">
    <button class="mc-btn" id="mc0" onclick="pickAnswer(0)"></button>
    <button class="mc-btn" id="mc1" onclick="pickAnswer(1)"></button>
    <button class="mc-btn" id="mc2" onclick="pickAnswer(2)"></button>
    <button class="mc-btn" id="mc3" onclick="pickAnswer(3)"></button>
  </div>

  <!-- Next button (test mode) -->
  <button class="btn-next" id="btn-next" onclick="advance()">Siguiente →</button>

  <!-- Flashcard controls -->
  <div class="reviewing-badge" id="reviewing-badge">← revisando · toca para continuar</div>
  <div class="nav-row" id="flash-nav">
    <button class="btn btn-nav" id="btn-back"  disabled onclick="goBack()">← Atrás</button>
    <button class="btn btn-ok"  id="btn-ok"    disabled onclick="handleAnswer(true)">✓ Lo sabía</button>
    <button class="btn btn-no"  id="btn-no"    disabled onclick="handleAnswer(false)">✗ No lo sabía</button>
    <button class="btn btn-nav" id="btn-skip"  onclick="handleSkip()">→</button>
  </div>

  <footer id="footer">196 cartas restantes</footer>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────
const COUNTRIES = [

function loadStats() {
  try { return JSON.parse(localStorage.getItem('fq_stats') || '{}'); } catch { return {}; }
}
function saveStats(s) {
  try { localStorage.setItem('fq_stats', JSON.stringify(s)); } catch {}

// ── Helpers ───────────────────────────────────────────────────────────────────
function shuffle(a) {
  const b = [...a];
  for (let i = b.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}
function setFlag(id, code) {
  const el = document.getElementById(id);
  const size = el.dataset.size === 'lg' ? '320' : '80';
  el.src = 'https://flagcdn.com/w' + size + '/' + code.toLowerCase() + '.png';
  el.alt = code;
}
function getPool() {
  return activeCont === 'all' ? [...COUNTRIES] : COUNTRIES.filter(c => c.co === activeCont);
}
function isReviewing() { return mode === 'flash' && idx < maxIdx; }

// ── Mode ──────────────────────────────────────────────────────────────────────
function setMode(m) {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  mode = m;
  ['flash','test','timer','marathon'].forEach(id => {
    document.getElementById('mode-'+id).classList.toggle('active', id === m);
  });
  document.getElementById('flash-nav').style.display     = m === 'flash' || m === 'marathon' ? '' : 'none';
  document.getElementById('mc-options').style.display    = m === 'test' || m === 'timer' ? 'grid' : 'none';
  document.getElementById('tap-hint').style.display      = m === 'flash' || m === 'marathon' ? '' : 'none';
  document.getElementById('scene').style.cursor          = m === 'flash' || m === 'marathon' ? 'pointer' : 'default';
  document.getElementById('timer-wrap').style.display    = m === 'timer' ? 'block' : 'none';
  document.getElementById('marathon-wrap').style.display = m === 'marathon' ? 'block' : 'none';
  document.getElementById('end-screen').style.display    = 'none';
  document.getElementById('card').style.display          = '';
  document.getElementById('btn-next').classList.remove('show');
  // Reset
  deck = shuffle(getPool()); idx = 0; maxIdx = 0;
  flipped = false; transitioning = false;
  score = {correct:0, wrong:0, streak:0};
  marathonWrong = [];
  document.getElementById('card').classList.remove('flipped');
  if (m === 'timer') startTimer();
  render(); updateScore();
}

// ── Continent ─────────────────────────────────────────────────────────────────
function setCont(btn) {
  document.querySelectorAll('.cont-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCont = btn.dataset.co;
  deck = shuffle(getPool());
  idx = 0; maxIdx = 0; flipped = false; transitioning = false;
  score = {correct:0, wrong:0, streak:0};
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('btn-next').classList.remove('show');
  render(); updateScore();
  document.getElementById('prog-label').textContent = CONT_LABELS[activeCont] || 'Todos';
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const co = deck[idx];
  setFlag('flag-front', co.c);
  setFlag('flag-back',  co.c);
  document.getElementById('country-name').textContent = co.n;
  document.getElementById('meta-cap').textContent  = co.cap  || '—';
  document.getElementById('meta-pop').textContent  = (co.pop || '—') + ' hab.';
  document.getElementById('meta-lang').textContent = co.lang || '—';
  document.getElementById('meta-cur').textContent  = co.cur  || '—';
  document.getElementById('meta-dom').textContent  = co.dom  || '—';
  document.getElementById('meta-area').textContent = co.area || '—';
  document.getElementById('meta-peak').textContent = co.peak || '—';
  document.getElementById('fact-text').textContent = co.f || '';
  document.getElementById('prog-cur').textContent  = idx;
  document.getElementById('prog-tot').textContent  = deck.length;
  document.getElementById('prog-fill').style.width = (idx/deck.length*100) + '%';
  document.getElementById('footer').textContent    = `${deck.length-idx} cartas restantes`;
  document.getElementById('reviewing-badge').classList.toggle('show', isReviewing());

  if (isReviewing()) {
    document.getElementById('card').classList.add('flipped');
  } else {
    document.getElementById('card').classList.remove('flipped');
    flipped = false;
  }

  if (mode === 'test' || mode === 'timer') renderMC();
  setButtons();
  updateMastery();
}

// ── Multiple choice ───────────────────────────────────────────────────────────
function renderMC() {
  mcAnswered = false;
  const correct = deck[idx];
  const pool = COUNTRIES.filter(c => c.c !== correct.c);
  const wrong = shuffle(pool).slice(0, 3);
  const opts = shuffle([correct, ...wrong]);
  mcAnswers = opts;
  mcCorrect = opts.findIndex(o => o.c === correct.c);

  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById('mc'+i);
    btn.textContent = opts[i].n;
    btn.className   = 'mc-btn';
    btn.disabled    = false;
  }
  document.getElementById('btn-next').classList.remove('show');
  // card stays unflipped
  document.getElementById('card').classList.remove('flipped');
}

function pickAnswer(i) {
  if (mcAnswered || transitioning) return;
  mcAnswered = true;
  const isCorrect = i === mcCorrect;

  // Mark buttons
  for (let j = 0; j < 4; j++) {
    const btn = document.getElementById('mc'+j);
    btn.disabled = true;
    if (j === mcCorrect) btn.classList.add(i === mcCorrect ? 'correct' : 'reveal');
    else if (j === i) btn.classList.add('wrong');
  }

  // Flip card to show info
  document.getElementById('card').classList.add('flipped');

  // Record
  recordAnswer(deck[idx].c, isCorrect);
  score.correct += isCorrect ? 1 : 0;
  score.wrong   += isCorrect ? 0 : 1;
  score.streak   = isCorrect ? score.streak+1 : 0;
  updateScore();
  updateMastery();
  if (mode === 'timer') {
    setTimeout(() => { if (!transitioning) advance(); }, 900);
  } else {
    document.getElementById('btn-next').classList.add('show');
  }
}

// ── Flashcard ─────────────────────────────────────────────────────────────────
function handleCardClick() {
  if (mode === 'test' || mode === 'timer') return;
  if (isReviewing()) { goForward(); return; }
  if (flipped || transitioning) return;
  flipped = true;
  document.getElementById('card').classList.add('flipped');
  setButtons();
}

function handleSkip() {
  if (isReviewing()) { goForward(); return; }
  advance();
}

function goBack() {
  if (idx === 0 || transitioning) return;
  idx--;
  flipped = false;
  render();
}

function goForward() {
  if (transitioning) return;
  transitioning = true;
  document.getElementById('card').classList.remove('flipped');
  flipped = false;
  setTimeout(() => {
    idx = maxIdx;
    transitioning = false;
    render(); setButtons();
  }, 400);
}

function handleAnswer(correct) {
  if (transitioning || isReviewing()) return;
  recordAnswer(deck[idx].c, correct);
  score.correct += correct ? 1 : 0;
  score.wrong   += correct ? 0 : 1;
  score.streak   = correct ? score.streak+1 : 0;
  if (mode === 'marathon' && !correct) {
    marathonWrong.push(deck[idx]);
  }
  advance();
}

// ── Advance ───────────────────────────────────────────────────────────────────
function advance() {
  if (transitioning) return;
  transitioning = true; flipped = false;
  setButtons();
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('btn-next').classList.remove('show');
  setTimeout(() => {
    idx++;
    if (mode === 'marathon') {
      if (idx >= deck.length) {
        if (marathonWrong.length > 0) {
          deck = shuffle(marathonWrong); marathonWrong = []; idx = 0; maxIdx = 0;
        } else {
          transitioning = false; showEndScreen(); return;
        }
      } else { maxIdx = Math.max(maxIdx, idx); }
    } else {
      if (idx >= deck.length) { deck = shuffle(getPool()); idx = 0; maxIdx = 0; }
      else { maxIdx = Math.max(maxIdx, idx); }
    }
    transitioning = false;
    render(); updateScore();
    if (mode === 'marathon') updateMarathonLeft();
  }, 680);
}

// ── Stats tracking ────────────────────────────────────────────────────────────
function recordAnswer(code, correct) {
  if (!globalStats[code]) globalStats[code] = {c:0, w:0};
  if (correct) globalStats[code].c++; else globalStats[code].w++;
  saveStats(globalStats);

  records.totalAnswered++;
  if (correct) records.totalCorrect++;
  if (score.streak+1 > records.bestStreak && correct) records.bestStreak = score.streak+1;
  saveRecords(records);
}

// Mastery: a country is "dominated" if correct > wrong and correct >= 2
function isDominated(code) {
  const s = globalStats[code];
  return s && s.c >= 2 && s.c > s.w;
}
function hasAttempted(code) {
  return globalStats[code] && (globalStats[code].c + globalStats[code].w) > 0;
}

function updateMastery() {
  const pool = getPool();
  const total = pool.length;
  const dominated = pool.filter(c => isDominated(c.c)).length;
  const attempted  = pool.filter(c => hasAttempted(c.c) && !isDominated(c.c)).length;
  document.getElementById('mastery-ok').style.width    = (dominated/total*100) + '%';
  document.getElementById('mastery-wrong').style.width = ((dominated+attempted)/total*100) + '%';
  document.getElementById('mastery-count').textContent = `${dominated} / ${total}`;
}

// ── Update UI ─────────────────────────────────────────────────────────────────
function updateScore() {
  document.getElementById('sc-correct').textContent = score.correct;
  document.getElementById('sc-wrong').textContent   = score.wrong;
  document.getElementById('sc-streak').textContent  = score.streak;
  document.getElementById('sc-record').textContent  = records.bestStreak;
  document.getElementById('streak-num').textContent = score.streak;
  document.getElementById('streak-badge').classList.toggle('show', score.streak >= 3);
  updateMastery();
}

function setButtons() {
  if (mode === 'flash' || mode === 'marathon') {
    const rev = isReviewing();
    document.getElementById('btn-ok').disabled    = !flipped || rev;
    document.getElementById('btn-no').disabled    = !flipped || rev;
    document.getElementById('btn-back').disabled  = idx === 0 || transitioning || mode === 'marathon';
    document.getElementById('btn-skip').textContent = rev ? '→ Nueva' : '→';
  }
}

// ── Stats modal ───────────────────────────────────────────────────────────────
function openStats() {
  const conts = [
    {id:'all',label:'🌐 Total',codes:COUNTRIES.map(c=>c.c)},
    {id:'A',  label:'🌍 África',    codes:COUNTRIES.filter(c=>c.co==='A').map(c=>c.c)},
    {id:'N',  label:'🌎 N. América',codes:COUNTRIES.filter(c=>c.co==='N').map(c=>c.c)},
    {id:'S',  label:'🌎 S. América',codes:COUNTRIES.filter(c=>c.co==='S').map(c=>c.c)},
    {id:'As', label:'🌏 Asia',      codes:COUNTRIES.filter(c=>c.co==='As').map(c=>c.c)},
    {id:'E',  label:'🏛️ Europa',    codes:COUNTRIES.filter(c=>c.co==='E').map(c=>c.c)},
    {id:'O',  label:'🏝️ Oceanía',   codes:COUNTRIES.filter(c=>c.co==='O').map(c=>c.c)},
  ];

  const el = document.getElementById('stats-conts');
  el.innerHTML = conts.map(({label,codes}) => {
    const total = codes.length;
    const dom   = codes.filter(c => isDominated(c)).length;
    const att   = codes.filter(c => hasAttempted(c) && !isDominated(c)).length;
    const pOk   = (dom/total*100).toFixed(0);
    const pW    = ((dom+att)/total*100).toFixed(0);
    return `<div class="stats-cont">
      <div class="stats-cont-name"><span>${label}</span><span style="color:#5a5450">${dom}/${total} dominadas</span></div>
      <div class="stats-bar-track">
        <div class="stats-bar-w"  style="width:${pW}%"></div>
        <div class="stats-bar-ok" style="width:${pOk}%"></div>
      </div>
    </div>`;
  }).join('');

  const rec = document.getElementById('stats-records');
  const accuracy = records.totalAnswered > 0
    ? Math.round(records.totalCorrect/records.totalAnswered*100) : 0;
  rec.innerHTML = `
    <div class="stat-card"><div class="stat-card-n">${records.bestStreak}</div><div class="stat-card-l">Mejor racha</div></div>
    <div class="stat-card"><div class="stat-card-n">${records.totalCorrect}</div><div class="stat-card-l">Total aciertos</div></div>
    <div class="stat-card"><div class="stat-card-n">${accuracy}%</div><div class="stat-card-l">Precisión</div></div>
  `;

  document.getElementById('stats-overlay').classList.add('show');
}

function closeStats(e) {
  if (!e || e.target === document.getElementById('stats-overlay') || e.currentTarget !== document.getElementById('stats-overlay')) {
    document.getElementById('stats-overlay').classList.remove('show');
  }
}

// ── Timer ────────────────────────────────────────────────────────────────────
let timerInterval = null, timerSeconds = 60;
function startTimer() {
  timerSeconds = 60;
  document.getElementById('timer-display').textContent = timerSeconds;
  document.getElementById('timer-display').style.color = 'var(--gold)';
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerSeconds--;
    document.getElementById('timer-display').textContent = timerSeconds;
    if (timerSeconds <= 10) document.getElementById('timer-display').style.color = 'var(--red)';
    if (timerSeconds <= 0) {
      clearInterval(timerInterval); timerInterval = null;
      showEndScreen();
    }
  }, 1000);
}
function showEndScreen() {
  document.getElementById('end-screen').style.display = 'block';
  const acc = score.correct + score.wrong > 0
    ? Math.round(score.correct / (score.correct + score.wrong) * 100) : 0;
  document.getElementById('end-title').textContent =
    mode === 'timer' ? '⏱️ ¡Se acabó el tiempo!' : '🏆 ¡Maratón completado!';
  document.getElementById('end-msg').textContent =
    mode === 'timer'
      ? `Respondiste ${score.correct + score.wrong} cartas · ${score.correct} correctas · ${acc}% precisión`
      : `Dominaste las ${deck.length + marathonWrong.length} cartas · Racha máxima: ${records.bestStreak}`;
  document.getElementById('mc-options').style.display = 'none';
  document.getElementById('btn-next').classList.remove('show');
  document.getElementById('card').style.display = 'none';
}
function restartMode() {
  document.getElementById('card').style.display = '';
  setMode(mode);
}

// ── Marathon ──────────────────────────────────────────────────────────────────
let marathonWrong = [];
function updateMarathonLeft() {
  const left = deck.length - idx + marathonWrong.length;
  document.getElementById('marathon-left').textContent = left;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
deck = shuffle([...COUNTRIES]);
setButtons();
render();
updateScore();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
